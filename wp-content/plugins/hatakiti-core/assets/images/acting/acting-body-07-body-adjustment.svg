<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 900" role="img" aria-labelledby="title desc"><title id="title">4-7　身体を自分で調整する</title><desc id="desc">今日の状態に気づき、必要なところを整える</desc><rect width="760" height="900" fill="#fbfaf7"/><rect x="16" y="16" width="728" height="78" rx="10" fill="#3f5664"/><text x="38" y="68" font-family="sans-serif" font-size="32" font-weight="700" fill="#fff">4-7　身体を自分で調整する</text><text x="38" y="132" font-family="sans-serif" font-size="24" font-weight="700" fill="#222">今日の状態に気づき、必要なところを整える</text><circle cx="380" cy="350" r="150" fill="#dceaf4"/><text x="335" y="330" font-family="sans-serif" font-size="24" font-weight="700">今日の</text><text x="320" y="365" font-family="sans-serif" font-size="24" font-weight="700">身体を感じる</text><g fill="none" stroke="#4b8ac6" stroke-width="7"><path d="M380 200 Q560 220 610 350"/><path d="M610 350 Q570 500 380 500"/><path d="M380 500 Q190 500 150 350"/><path d="M150 350 Q200 220 380 200"/></g><text x="270" y="570" font-family="sans-serif" font-size="20">感じる → 気づく → 小さく動く → 調整する → もう一度感じる</text><g transform="translate(635,700) scale(0.55)" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"><circle cx="0" cy="0" r="38" fill="#f4d6c1"/><path d="M-28 45 Q0 28 28 45 L42 150 Q0 175 -42 150Z" fill="#e6e2dc"/><path d="M-38 60 L-78 135 M38 60 L78 135 M-18 150 L-30 245 M18 150 L30 245"/><path d="M-30 245 L-48 250 M30 245 L48 250"/></g><rect x="28" y="820" width="704" height="52" rx="10" fill="#f2ead7"/><text x="48" y="853" font-family="sans-serif" font-size="20" fill="#333">昨日と今日の身体は同じではない。自分で状態を確かめて調整する。</text></svg>