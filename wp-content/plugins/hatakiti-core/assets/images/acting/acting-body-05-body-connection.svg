<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 900" role="img" aria-labelledby="title desc"><title id="title">4-5　身体を連動させる</title><desc id="desc">部分を知ったら、全身のつながりを感じる</desc><rect width="760" height="900" fill="#fbfaf7"/><rect x="16" y="16" width="728" height="78" rx="10" fill="#3f5664"/><text x="38" y="68" font-family="sans-serif" font-size="32" font-weight="700" fill="#fff">4-5　身体を連動させる</text><text x="38" y="132" font-family="sans-serif" font-size="24" font-weight="700" fill="#222">部分を知ったら、全身のつながりを感じる</text><g transform="translate(150,280)" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"><circle cx="0" cy="0" r="38" fill="#f4d6c1"/><path d="M-28 45 Q0 28 28 45 L42 150 Q0 175 -42 150Z" fill="#e6e2dc"/><path d="M-38 60 L-78 135 M38 60 L78 135 M-18 150 L-30 245 M18 150 L30 245"/><path d="M-30 245 L-48 250 M30 245 L48 250"/></g><g transform="translate(380,280)" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"><circle cx="0" cy="0" r="38" fill="#f4d6c1"/><path d="M-28 45 Q0 28 28 45 L42 150 Q0 175 -42 150Z" fill="#e6e2dc"/><path d="M-38 60 L-78 135 M38 60 L78 135 M-18 150 L-30 245 M18 150 L30 245"/><path d="M-30 245 L-48 250 M30 245 L48 250"/></g><g transform="translate(610,280)" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"><circle cx="0" cy="0" r="38" fill="#f4d6c1"/><path d="M-28 45 Q0 28 28 45 L42 150 Q0 175 -42 150Z" fill="#e6e2dc"/><path d="M-38 60 L-78 135 M38 60 L78 135 M-18 150 L-30 245 M18 150 L30 245"/><path d="M-30 245 L-48 250 M30 245 L48 250"/></g><g fill="none" stroke="#4b8ac6" stroke-width="10"><path d="M180 340 Q260 240 330 340"/><path d="M410 340 Q500 230 575 330"/></g><text x="95" y="620" font-family="sans-serif" font-size="23" font-weight="700">腕を動かす → 肩・背中・胸にも変化</text><text x="95" y="665" font-family="sans-serif" font-size="23" font-weight="700">一つの部分を動かしたとき、ほかはどう変わる？</text><rect x="28" y="820" width="704" height="52" rx="10" fill="#f2ead7"/><text x="48" y="853" font-family="sans-serif" font-size="20" fill="#333">「部分を分けて感じる」と「身体を切り離す」は同じではない。</text></svg>