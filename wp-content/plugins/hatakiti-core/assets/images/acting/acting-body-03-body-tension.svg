<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 900" role="img" aria-labelledby="title desc"><title id="title">4-3　身体の力を知る</title><desc id="desc">どこに力が入っているのかを自分で確かめる</desc><rect width="760" height="900" fill="#fbfaf7"/><rect x="16" y="16" width="728" height="78" rx="10" fill="#3f5664"/><text x="38" y="68" font-family="sans-serif" font-size="32" font-weight="700" fill="#fff">4-3　身体の力を知る</text><text x="38" y="132" font-family="sans-serif" font-size="24" font-weight="700" fill="#222">どこに力が入っているのかを自分で確かめる</text><g transform="translate(140 230)"><path d="M0 30 q40 -70 100 0 v90 q-50 60 -100 0z" fill="#f4d6c1" stroke="#333" stroke-width="4"/><path d="M95 80 L250 140" stroke="#d97864" stroke-width="28" stroke-linecap="round"/><path d="M0 95 L-70 160" stroke="#d97864" stroke-width="28" stroke-linecap="round"/></g><g transform="translate(500,255)" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"><circle cx="0" cy="0" r="38" fill="#f4d6c1"/><path d="M-28 45 Q0 28 28 45 L42 150 Q0 175 -42 150Z" fill="#e6e2dc"/><path d="M-38 60 L-78 135 M38 60 L78 135 M-18 150 L-30 245 M18 150 L30 245"/><path d="M-30 245 L-48 250 M30 245 L48 250"/></g><rect x="60" y="560" width="640" height="180" rx="18" fill="#eef3f6"/><text x="85" y="600" font-family="sans-serif" font-size="21" font-weight="700">力の場所を探す</text><text x="85" y="638" font-family="sans-serif" font-size="19">① 動かす　→　② ほかの場所の変化を感じる　→　③ 力を抜く</text><text x="85" y="680" font-family="sans-serif" font-size="19">手を握っただけなのに、肩まで固くなっていない？</text><rect x="28" y="820" width="704" height="52" rx="10" fill="#f2ead7"/><text x="48" y="853" font-family="sans-serif" font-size="20" fill="#333">力が入ることが悪いのではなく、「どこに力を使っているか」を知る。</text></svg>