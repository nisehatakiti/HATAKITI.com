<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 900" role="img" aria-labelledby="title desc"><title id="title">4-1　自分の身体を知る</title><desc id="desc">身体を頭から足まで、部分として認識する</desc><rect width="760" height="900" fill="#fbfaf7"/><rect x="16" y="16" width="728" height="78" rx="10" fill="#3f5664"/><text x="38" y="68" font-family="sans-serif" font-size="32" font-weight="700" fill="#fff">4-1　自分の身体を知る</text><text x="38" y="132" font-family="sans-serif" font-size="24" font-weight="700" fill="#222">身体を頭から足まで、部分として認識する</text><g transform="translate(260,245)" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"><circle cx="0" cy="0" r="38" fill="#f4d6c1"/><path d="M-28 45 Q0 28 28 45 L42 150 Q0 175 -42 150Z" fill="#e6e2dc"/><path d="M-38 60 L-78 135 M38 60 L78 135 M-18 150 L-30 245 M18 150 L30 245"/><path d="M-30 245 L-48 250 M30 245 L48 250"/></g><g transform="translate(500,245)" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"><circle cx="0" cy="0" r="38" fill="#f4d6c1"/><path d="M-28 45 Q0 28 28 45 L42 150 Q0 175 -42 150Z" fill="#e6e2dc"/><path d="M-38 60 L-78 135 M38 60 L78 135 M-18 150 L-30 245 M18 150 L30 245"/><path d="M-30 245 L-48 250 M30 245 L48 250"/></g><text x="75" y="180" font-family="sans-serif" font-size="20">頭</text><text x="75" y="238" font-family="sans-serif" font-size="20">首</text><text x="75" y="296" font-family="sans-serif" font-size="20">肩</text><text x="75" y="354" font-family="sans-serif" font-size="20">胸</text><text x="75" y="412" font-family="sans-serif" font-size="20">腹</text><text x="75" y="470" font-family="sans-serif" font-size="20">骨盤</text><text x="75" y="528" font-family="sans-serif" font-size="20">脚</text><text x="75" y="586" font-family="sans-serif" font-size="20">足</text><g stroke="#4b8ac6" stroke-width="3"><path d="M110 176H220"/><path d="M110 234H220"/><path d="M110 292H220"/><path d="M110 350H220"/><path d="M110 408H220"/><path d="M110 466H220"/><path d="M110 524H220"/><path d="M110 582H220"/></g><text x="90" y="680" font-family="sans-serif" font-size="25" font-weight="700">今、自分の身体のどこに意識がある？</text><rect x="28" y="820" width="704" height="52" rx="10" fill="#f2ead7"/><text x="48" y="853" font-family="sans-serif" font-size="20" fill="#333">身体の場所を「知っている」ことが、意識して扱う第一歩。</text></svg>