<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 900" role="img" aria-labelledby="title desc"><title id="title">4-4　身体を部分として動かす</title><desc id="desc">一つずつ意識して動かし、自分で動きを選ぶ</desc><rect width="760" height="900" fill="#fbfaf7"/><rect x="16" y="16" width="728" height="78" rx="10" fill="#3f5664"/><text x="38" y="68" font-family="sans-serif" font-size="32" font-weight="700" fill="#fff">4-4　身体を部分として動かす</text><text x="38" y="132" font-family="sans-serif" font-size="24" font-weight="700" fill="#222">一つずつ意識して動かし、自分で動きを選ぶ</text><g transform="translate(150 300)"><g transform="scale(0.75)" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"><circle cx="0" cy="0" r="38" fill="#f4d6c1"/><path d="M-28 45 Q0 28 28 45 L42 150 Q0 175 -42 150Z" fill="#e6e2dc"/><path d="M-38 60 L-78 135 M38 60 L78 135 M-18 150 L-30 245 M18 150 L30 245"/><path d="M-30 245 L-48 250 M30 245 L48 250"/></g><path d="M-20 65 L-100 20" stroke="#4b8ac6" stroke-width="10"/><path d="M-20 65 L100 100" stroke="#4b8ac6" stroke-width="6"/></g><text x="90" y="550" font-family="sans-serif" font-size="18">右肩だけ</text><g transform="translate(350 300)"><g transform="scale(0.75)" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"><circle cx="0" cy="0" r="38" fill="#f4d6c1"/><path d="M-28 45 Q0 28 28 45 L42 150 Q0 175 -42 150Z" fill="#e6e2dc"/><path d="M-38 60 L-78 135 M38 60 L78 135 M-18 150 L-30 245 M18 150 L30 245"/><path d="M-30 245 L-48 250 M30 245 L48 250"/></g><path d="M-20 65 L100 20" stroke="#4b8ac6" stroke-width="10"/><path d="M-20 65 L-100 100" stroke="#4b8ac6" stroke-width="6"/></g><text x="290" y="550" font-family="sans-serif" font-size="18">左肩だけ</text><g transform="translate(550 300)"><g transform="scale(0.75)" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"><circle cx="0" cy="0" r="38" fill="#f4d6c1"/><path d="M-28 45 Q0 28 28 45 L42 150 Q0 175 -42 150Z" fill="#e6e2dc"/><path d="M-38 60 L-78 135 M38 60 L78 135 M-18 150 L-30 245 M18 150 L30 245"/><path d="M-30 245 L-48 250 M30 245 L48 250"/></g><path d="M-20 65 L100 20" stroke="#4b8ac6" stroke-width="10"/><path d="M-20 65 L-100 100" stroke="#4b8ac6" stroke-width="6"/></g><text x="490" y="550" font-family="sans-serif" font-size="18">右腕だけ</text><rect x="80" y="610" width="600" height="110" rx="18" fill="#f2ead7"/><text x="110" y="650" font-family="sans-serif" font-size="21">大きく動かす必要はありません。</text><text x="110" y="685" font-family="sans-serif" font-size="21">「今、どこを動かしている？」を確かめる。</text><rect x="28" y="820" width="704" height="52" rx="10" fill="#f2ead7"/><text x="48" y="853" font-family="sans-serif" font-size="20" fill="#333">小さな動きでも、どこを動かしているか分かればよい。</text></svg>