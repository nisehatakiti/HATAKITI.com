<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 900" role="img" aria-labelledby="title desc"><title id="title">4-2　身体の感覚を感じる</title><desc id="desc">見るだけでなく、自分の身体がどう感じているかを探す</desc><rect width="760" height="900" fill="#fbfaf7"/><rect x="16" y="16" width="728" height="78" rx="10" fill="#3f5664"/><text x="38" y="68" font-family="sans-serif" font-size="32" font-weight="700" fill="#fff">4-2　身体の感覚を感じる</text><text x="38" y="132" font-family="sans-serif" font-size="24" font-weight="700" fill="#222">見るだけでなく、自分の身体がどう感じているかを探す</text><g transform="translate(300,270)" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"><circle cx="0" cy="0" r="38" fill="#f4d6c1"/><path d="M-28 45 Q0 28 28 45 L42 150 Q0 175 -42 150Z" fill="#e6e2dc"/><path d="M-38 60 L-78 135 M38 60 L78 135 M-18 150 L-30 245 M18 150 L30 245"/><path d="M-30 245 L-48 250 M30 245 L48 250"/></g><g fill="#4b8ac6"><circle cx="300" cy="270" r="8"/><circle cx="300" cy="340" r="8"/><circle cx="300" cy="410" r="8"/><circle cx="300" cy="480" r="8"/><circle cx="300" cy="550" r="8"/></g><rect x="430" y="205" width="260" height="410" rx="18" fill="#f2ead7"/><text x="455" y="245" font-family="sans-serif" font-size="21" font-weight="700">こんな感覚を探す</text><text x="465" y="285" font-family="sans-serif" font-size="20">• 温かい</text><text x="465" y="323" font-family="sans-serif" font-size="20">• 冷たい</text><text x="465" y="361" font-family="sans-serif" font-size="20">• 重い・軽い</text><text x="465" y="399" font-family="sans-serif" font-size="20">• 張っている</text><text x="465" y="437" font-family="sans-serif" font-size="20">• ゆるんでいる</text><text x="465" y="475" font-family="sans-serif" font-size="20">• 触れている</text><text x="465" y="513" font-family="sans-serif" font-size="20">• 心地よい</text><text x="465" y="551" font-family="sans-serif" font-size="20">• 違和感がある</text><rect x="28" y="820" width="704" height="52" rx="10" fill="#f2ead7"/><text x="48" y="853" font-family="sans-serif" font-size="20" fill="#333">足裏から頭まで、順番に感じてみる。</text></svg>