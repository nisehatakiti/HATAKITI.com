<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 900" role="img" aria-labelledby="title desc"><title id="title">4-6　身体の可動域を知る</title><desc id="desc">自分の身体が、どこまで無理なく動くのかを知る</desc><rect width="760" height="900" fill="#fbfaf7"/><rect x="16" y="16" width="728" height="78" rx="10" fill="#3f5664"/><text x="38" y="68" font-family="sans-serif" font-size="32" font-weight="700" fill="#fff">4-6　身体の可動域を知る</text><text x="38" y="132" font-family="sans-serif" font-size="24" font-weight="700" fill="#222">自分の身体が、どこまで無理なく動くのかを知る</text><g transform="translate(180,280)" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"><circle cx="0" cy="0" r="38" fill="#f4d6c1"/><path d="M-28 45 Q0 28 28 45 L42 150 Q0 175 -42 150Z" fill="#e6e2dc"/><path d="M-38 60 L-78 135 M38 60 L78 135 M-18 150 L-30 245 M18 150 L30 245"/><path d="M-30 245 L-48 250 M30 245 L48 250"/></g><g transform="translate(500,280)" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"><circle cx="0" cy="0" r="38" fill="#f4d6c1"/><path d="M-28 45 Q0 28 28 45 L42 150 Q0 175 -42 150Z" fill="#e6e2dc"/><path d="M-38 60 L-78 135 M38 60 L78 135 M-18 150 L-30 245 M18 150 L30 245"/><path d="M-30 245 L-48 250 M30 245 L48 250"/></g><path d="M180 270 Q180 120 300 170" fill="none" stroke="#4b8ac6" stroke-width="9"/><path d="M500 280 q100 -120 0 -200" fill="none" stroke="#4b8ac6" stroke-width="9"/><rect x="70" y="560" width="620" height="170" rx="18" fill="#eef3f6"/><text x="95" y="600" font-family="sans-serif" font-size="21" font-weight="700">自分の現在の範囲を知る</text><text x="95" y="640" font-family="sans-serif" font-size="19">痛みのない範囲で、無理なく動かす。</text><text x="95" y="680" font-family="sans-serif" font-size="19">たくさん動かせることが目的ではない。</text><rect x="28" y="820" width="704" height="52" rx="10" fill="#f2ead7"/><text x="48" y="853" font-family="sans-serif" font-size="20" fill="#333">現在の範囲を知れば、無理な動きを避けながら必要な動きを選べる。</text></svg>