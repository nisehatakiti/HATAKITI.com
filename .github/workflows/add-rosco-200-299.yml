name: Add Rosco E-Colour 200-299
on:
  push:
    branches: [main]
    paths:
      - scripts/add-rosco-200-299.py
      - .github/workflows/add-rosco-200-299.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append Rosco E-Colour 200-299
        run: python scripts/add-rosco-200-299.py
      - name: Remove one-time helper files
        run: |
          rm -f scripts/add-rosco-200-299.py .github/workflows/add-rosco-200-299.yml
      - name: Commit database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wp-content/themes/hatakiti/assets/data/gel-colors.json
          git add -u scripts/add-rosco-200-299.py .github/workflows/add-rosco-200-299.yml
          git commit -m "Add Rosco E-Colour 200-299" || exit 0
          git push
